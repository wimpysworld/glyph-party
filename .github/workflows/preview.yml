name: Preview Deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy-pages.yml
    with:
      branch: ${{ github.head_ref }}
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment-preview:
    name: Comment on PR
    needs: deploy-preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        run: |
          body=$(printf '## Preview Deployment\n\n| Status | URL |\n|--------|-----|\n| Deployed | %s |\n\n**Branch:** `%s`\n**Commit:** `%s`' "${DEPLOYMENT_URL}" "${PREVIEW_BRANCH}" "${PREVIEW_COMMIT}")
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "${body}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ needs.deploy-preview.outputs.deployment_url }}
          PREVIEW_BRANCH: ${{ github.head_ref }}
          PREVIEW_COMMIT: ${{ github.sha }}
