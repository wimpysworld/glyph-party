name: Preview Deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy-pages.yml
    with:
      branch: ${{ github.head_ref }}
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment-preview:
    name: Comment on PR
    needs: deploy-preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_URL: ${{ needs.deploy-preview.outputs.deployment_url }}
          PREVIEW_BRANCH: ${{ github.head_ref }}
          PREVIEW_COMMIT: ${{ github.sha }}
        with:
          script: |
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const branch = process.env.PREVIEW_BRANCH;
            const commit = process.env.PREVIEW_COMMIT;
            const body = `## Preview Deployment

            | Status | URL |
            |--------|-----|
            | Deployed | ${deploymentUrl} |

            **Branch:** \`${branch}\`
            **Commit:** \`${commit}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
