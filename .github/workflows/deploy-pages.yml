name: Deploy Cloudflare Pages

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      commit_hash:
        required: false
        type: string
        default: ""
      commit_message:
        required: false
        type: string
        default: ""
    secrets:
      cloudflare_api_token:
        required: true
      cloudflare_account_id:
        required: true
    outputs:
      deployment_url:
        description: Cloudflare Pages deployment URL
        value: ${{ jobs.deploy.outputs.deployment_url }}

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.cloudflare_api_token }}
          accountId: ${{ secrets.cloudflare_account_id }}
          command: >-
            pages deploy src --project-name=glyph-party --branch=${{ toJSON(inputs.branch) }}
            ${{ inputs.commit_hash != '' && format('--commit-hash={0}', toJSON(inputs.commit_hash)) || '' }}
            ${{ inputs.commit_message != '' && format('--commit-message={0}', toJSON(inputs.commit_message)) || '' }}
